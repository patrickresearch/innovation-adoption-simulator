[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adoptsim"
version = "0.0.1"
description = "Stochastic Bass diffusion with text-embedding analog priors for pre-launch adoption forecasting."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Patrick Petter" }]
keywords = ["bass model", "diffusion of innovations", "forecasting", "sde", "embeddings", "marketing science"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
notebooks = ["jupyterlab>=4", "matplotlib>=3.8", "pyyaml>=6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
    "nbmake>=1.5",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Repository = "https://github.com/<user>/innovation-adoption-simulator"

[tool.hatch.build.targets.wheel]
packages = ["src/adoptsim"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806"]  # math notation (N, F, T) is intentional

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E402", "B018"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: requires internet access (deselect with -m 'not network')"]

[tool.coverage.run]
source = ["adoptsim"]
branch = true
